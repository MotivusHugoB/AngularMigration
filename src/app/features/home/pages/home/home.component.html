<div class="home-page">
  <div class="banner" *ngIf="!isAuthenticated">
    <div class="container">
      <h1 class="logo-font">{{ appName }}</h1>
      <p>A place to share your knowledge.</p>
    </div>
  </div>

  <div class="container page">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          <ul class="nav nav-pills outline-active">
            <li class="nav-item" *ngIf="isAuthenticated">
              <a class="nav-link"
                 [class.active]="listConfig.type === 'feed'"
                 (click)="changeList({type: 'feed'})">
                Your Feed
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link"
                 [class.active]="listConfig.type === 'all'"
                 (click)="changeList({type: 'all'})">
                Global Feed
              </a>
            </li>
            <li class="nav-item" *ngIf="listConfig.filters.tag">
              <a class="nav-link active">
                <i class="ion-pound"></i> {{ listConfig.filters.tag }}
              </a>
            </li>
          </ul>
        </div>

        <app-article-list [limit]="10" [config]="listConfig"></app-article-list>
      </div>

      <div class="col-md-3">
        <div class="sidebar">
          <p>Popular Tags</p>

          <div class="tag-list" *ngIf="tagsLoaded">
            <a *ngFor="let tag of tags"
               (click)="changeList({type: 'all', filters: {tag: tag}})"
               class="tag-default tag-pill">
              {{ tag }}
            </a>
          </div>

          <div [hidden]="tagsLoaded">
            Loading tags...
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
