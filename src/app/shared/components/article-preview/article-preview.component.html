<div class="article-preview">
  <div class="article-meta">
    <a [routerLink]="['/profile', article.author.username]">
      <img [src]="article.author.image" />
    </a>
    <div class="info">
      <a [routerLink]="['/profile', article.author.username]" class="author">
        {{ article.author.username }}
      </a>
      <span class="date">{{ article.createdAt | date: 'longDate' }}</span>
    </div>
    <div class="pull-xs-right">
      <button 
        class="btn btn-sm"
        [ngClass]="{'btn-primary': article.favorited, 'btn-outline-primary': !article.favorited}"
        (click)="toggleFavorite()">
        <i class="ion-heart"></i> {{ article.favoritesCount }}
      </button>
    </div>
  </div>
  <a [routerLink]="['/article', article.slug]" class="preview-link">
    <h1>{{ article.title }}</h1>
    <p>{{ article.description }}</p>
    <span>Read more...</span>
    <ul class="tag-list">
      <li class="tag-default tag-pill tag-outline" *ngFor="let tag of article.tagList">
        {{ tag }}
      </li>
    </ul>
  </a>
</div>
